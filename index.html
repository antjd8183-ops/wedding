.wrap {

}

.main-photo {

.names {

.line {

}

.info {

  line-height: 2;
  color: #666;
}

.info strong {

}

.map {

  margin-top: 25px;
  padding: 10px 28px;
  border: 1px solid #ddd;
  color: #555;
  text-decoration: none;
  font-size: 13px;
}

.photos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.photos div {
  aspect-ratio: 1 / 1;
  background: #eee;
}

.footer {
  padding: 50px 20px;
  text-align: center;
  color: #aaa;
